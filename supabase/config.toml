# Local-only stack. Never link reset/start commands to the hosted project.
project_id = "knowngdb-local"

[api]
enabled = true
port = 54321
schemas = ["public", "catalog"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5176"
additional_redirect_urls = ["http://127.0.0.1:5173/?recovery=1", "http://127.0.0.1:5175/?recovery=1", "http://127.0.0.1:5174/admin/?recovery=1", "http://127.0.0.1:5176/?recovery=1", "http://127.0.0.1:5177/admin/?recovery=1"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
